<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Análise de Despesas</title>
        <!--Aqui fica o link de estilos da página-->
        <link rel="stylesheet" href="css/estilo.css">
        <script src="js/app.js" defer></script>
    </head>
    <body>
        <header>
            <h1 class="main-title">Análise de Despesas</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <div class="container-activity">
                <section class="atividade">
                    <form action="" method="post" data-api-path="/analise-despesas" data-result-id="bloco-resultado-despesas" data-error-id="erro-despesas">
                        <fieldset>
                            <legend>Dados de Despesas</legend>
                            <div>
                                <label for="despesa-1">Despesa 1</label>
                                <input type="number" id="despesa-1" name="despesa-1" step="0.01" min="0.01" placeholder="300.00" aria-describedby="despesas-ajuda" required/>
                            </div>
                            <div>
                                <label for="despesa-2">Despesa 2</label>
                                <input type="number" id="despesa-2" name="despesa-2" step="0.01" min="0.01" placeholder="150.00" aria-describedby="despesas-ajuda" required/>
                            </div>
                            <div>
                                <label for="despesa-3">Despesa 3</label>
                                <input type="number" id="despesa-3" name="despesa-3" step="0.01" min="0.01" placeholder="80.00" aria-describedby="despesas-ajuda" required/>
                            </div>
                            <div>
                                <label for="despesa-4">Despesa 4</label>
                                <input type="number" id="despesa-4" name="despesa-4" step="0.01" min="0.01" placeholder="220.00" aria-describedby="despesas-ajuda" required/>
                            </div>
                            <div>
                                <label for="despesa-5">Despesa 5</label>
                                <input type="number" id="despesa-5" name="despesa-5" step="0.01" min="0.01" placeholder="500.00" aria-describedby="despesas-ajuda" required/>
                            </div>
                            <!--Texto de suporte discreto-->
                            <small id="despesas-ajuda">
                                Digite apenas números (ex.: 1500.50)
                            </small>
                            <button type="submit">Enviar</button>
                        </fieldset>
                        <div class="resultado" id="bloco-resultado-despesas" aria-live="polite"></div>
                    </form>
                </section>
            </div>
            <div class="mensagem-erro" id="erro-despesas" role="alert"></div>
        </main>
        <aside class="chat-ia" aria-labelledby="chat-titulo">
            <h2 id="chat-titulo">Chat com IA</h2>
            <p id="chat-ajuda">Em breve: o assistente responderá aqui.</p>
            <form action="" method="post" data-api-path="/chat" data-result-id="chat-resposta" data-error-id="chat-resposta">
                <label for="pergunta-chat">Sua pergunta:</label>
                <textarea id="pergunta-chat" name="pergunta" rows="2" placeholder="Digite sua pergunta" aria-describedby="chat-ajuda" required></textarea>
                <button type="submit">Enviar</button>
            </form>
            <div class="chat-resposta" id="chat-resposta" role="status" aria-live="polite">A resposta aparecerá aqui.</div>
        </aside>
        <footer>Todos os direitos reservados</footer>
    </body>
</html>
